services:
  - type: web
    name: showroom-ar-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: node --version
    startCommand: node app.js
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://dandywork28-prog.github.io
